{% extends "base.html" %}

{% block title %}Round Log - ToN Stats{% endblock %}

{% block content %}
<div class="page-content">
    <h1>Round Log</h1>

    <!-- Filters -->
    <div class="filter-section">
        <div class="filter-row">
            <div class="filter-group">
                <label for="filterRoundType">Round Type</label>
                <select id="filterRoundType" class="filter-select">
                    <option value="">All Types</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filterTerror">Terror</label>
                <input type="text" id="filterTerror" class="filter-input" placeholder="Filter by terror name...">
            </div>
            <div class="filter-group">
                <label for="filterMap">Map</label>
                <input type="text" id="filterMap" class="filter-input" placeholder="Filter by map...">
            </div>
        </div>
    </div>

    <!-- Round Log Table -->
    <div class="log-section">
        <div class="table-container">
            <table class="data-table" id="roundLogTable">
                <thead>
                    <tr>
                        <th>Time</th>
                        <th>Round Type</th>
                        <th>Map</th>
                        <th>Terrors</th>
                        <th>Players</th>
                        <th>Instance</th>
                    </tr>
                </thead>
                <tbody id="roundLogBody">
                    <tr><td colspan="6" class="loading">Loading...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="pagination-controls">
            <button id="prevPage" class="btn btn-outline btn-small" disabled>Previous</button>
            <span id="pageInfo">Page 1</span>
            <button id="nextPage" class="btn btn-outline btn-small">Next</button>
        </div>
    </div>
</div>

<style>
.filter-section {
    background: var(--bg-secondary);
    padding: 1.5rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    margin-bottom: 1.5rem;
}

.filter-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
}

.filter-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.filter-group label {
    color: var(--text-secondary);
    font-size: 0.875rem;
}

.filter-input,
.filter-select {
    padding: 0.75rem 1rem;
    background-color: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-primary);
    font-size: 1rem;
}

.filter-input:focus,
.filter-select:focus {
    outline: none;
    border-color: var(--accent);
}

.log-section {
    background: var(--bg-secondary);
    padding: 1.5rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
}

.pagination-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 1rem;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
}

#pageInfo {
    color: var(--text-secondary);
}

.btn-small {
    padding: 0.5rem 1rem;
    font-size: 0.875rem;
}

.terrors-cell {
    max-width: 250px;
}

.terror-tag {
    display: inline-block;
    padding: 0.125rem 0.5rem;
    background: var(--bg-tertiary);
    border-radius: 4px;
    font-size: 0.75rem;
    margin: 0.125rem;
}

.instance-link {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    padding: 0.25rem 0.5rem;
    background: var(--accent);
    color: white;
    border-radius: 4px;
    font-size: 0.75rem;
    text-decoration: none;
    transition: background 0.2s;
}

.instance-link:hover {
    background: var(--accent-hover);
    color: white;
}

.instance-link::before {
    content: "▶";
    font-size: 0.625rem;
}

.player-count {
    font-weight: 500;
    color: var(--text-secondary);
}

@media (max-width: 768px) {
    .filter-row {
        grid-template-columns: 1fr;
    }
}
</style>
{% endblock %}

{% block scripts %}
<script>
    let allRounds = [];
    let filteredRounds = [];
    let currentPage = 1;
    const perPage = 50;

    // Load round log
    async function loadRoundLog() {
        try {
            const res = await fetch('/api/v1/stats/recent-rounds?limit=500');
            if (res.ok) {
                allRounds = await res.json();
                applyFilters();
            }
        } catch (error) {
            console.error('Failed to load round log:', error);
            document.getElementById('roundLogBody').innerHTML = '<tr><td colspan="6" class="error">Failed to load</td></tr>';
        }
    }

    // Load filter options
    async function loadFilterOptions() {
        try {
            const res = await fetch('/api/v1/stats/filter-options');
            if (res.ok) {
                const options = await res.json();
                const select = document.getElementById('filterRoundType');
                options.round_types.forEach(rt => {
                    const option = document.createElement('option');
                    option.value = rt;
                    option.textContent = rt;
                    select.appendChild(option);
                });
            }
        } catch (error) {
            console.error('Failed to load filter options:', error);
        }
    }

    function applyFilters() {
        const roundTypeFilter = document.getElementById('filterRoundType').value;
        const terrorFilter = document.getElementById('filterTerror').value.toLowerCase();
        const mapFilter = document.getElementById('filterMap').value.toLowerCase();

        filteredRounds = allRounds.filter(r => {
            if (roundTypeFilter && r.round_type !== roundTypeFilter) return false;
            if (terrorFilter && (!r.terrors || !r.terrors.some(t => t.toLowerCase().includes(terrorFilter)))) return false;
            if (mapFilter && (!r.map_name || !r.map_name.toLowerCase().includes(mapFilter))) return false;
            return true;
        });

        currentPage = 1;
        renderRoundLog();
    }

    function renderRoundLog() {
        const tbody = document.getElementById('roundLogBody');
        const start = (currentPage - 1) * perPage;
        const end = start + perPage;
        const pageData = filteredRounds.slice(start, end);

        if (pageData.length === 0) {
            tbody.innerHTML = '<tr><td colspan="6" class="empty">No rounds found</td></tr>';
            document.getElementById('prevPage').disabled = true;
            document.getElementById('nextPage').disabled = true;
            document.getElementById('pageInfo').textContent = 'No results';
            return;
        }

        tbody.innerHTML = pageData.map(r => {
            // Create instance detail link
            const instanceLink = createInstanceLink(r.instance_db_id, r.instance_id);

            return `
                <tr>
                    <td>${new Date(r.started_at).toLocaleString('ja-JP')}</td>
                    <td><span class="round-type">${escapeHtml(r.round_type)}</span></td>
                    <td>${escapeHtml(r.map_name || '-')}</td>
                    <td class="terrors-cell">
                        ${r.terrors && r.terrors.length > 0
                            ? r.terrors.map(t => `<span class="terror-tag">${escapeHtml(t)}</span>`).join('')
                            : '-'}
                    </td>
                    <td><span class="player-count">${r.player_count}</span></td>
                    <td>${instanceLink}</td>
                </tr>
            `;
        }).join('');

        // Update pagination
        const totalPages = Math.ceil(filteredRounds.length / perPage);
        document.getElementById('prevPage').disabled = currentPage <= 1;
        document.getElementById('nextPage').disabled = currentPage >= totalPages;
        document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages} (${filteredRounds.length} rounds)`;
    }

    function createInstanceLink(instanceDbId, instanceId) {
        if (!instanceDbId) return '-';

        // Extract short instance number for display
        let shortId = 'View';
        if (instanceId) {
            const parts = instanceId.split(':');
            if (parts.length >= 2) {
                shortId = parts.slice(1).join(':').split('~')[0] || 'View';
            }
        }

        return `<a href="/instance/${instanceDbId}" class="instance-link" title="${escapeHtml(instanceId || '')}">${escapeHtml(shortId)}</a>`;
    }

    // Filter event listeners
    document.getElementById('filterRoundType').addEventListener('change', applyFilters);
    document.getElementById('filterTerror').addEventListener('input', debounce(applyFilters, 300));
    document.getElementById('filterMap').addEventListener('input', debounce(applyFilters, 300));

    // Pagination
    document.getElementById('prevPage').addEventListener('click', () => {
        if (currentPage > 1) {
            currentPage--;
            renderRoundLog();
        }
    });

    document.getElementById('nextPage').addEventListener('click', () => {
        const totalPages = Math.ceil(filteredRounds.length / perPage);
        if (currentPage < totalPages) {
            currentPage++;
            renderRoundLog();
        }
    });

    // Debounce helper
    function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    }

    // Initial load
    loadFilterOptions();
    loadRoundLog();
</script>
{% endblock %}
