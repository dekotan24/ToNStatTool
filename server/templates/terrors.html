{% extends "base.html" %}

{% block title %}Terror Stats - ToN Stats{% endblock %}

{% block content %}
<div class="page-content">
    <h1>Terror Statistics</h1>

    <div class="search-bar">
        <input type="text" id="terrorSearch" placeholder="Search terror name..." class="search-input">
    </div>

    <div class="table-container">
        <table class="data-table sortable" id="terrorTable">
            <thead>
                <tr>
                    <th data-sort="name">Terror Name</th>
                    <th data-sort="count">Encounters</th>
                    <th data-sort="rate">Survival Rate</th>
                </tr>
            </thead>
            <tbody id="terrorTableBody">
                <tr><td colspan="3" class="loading">Loading...</td></tr>
            </tbody>
        </table>
    </div>

    <div class="pagination" id="pagination"></div>
</div>
{% endblock %}

{% block scripts %}
<script>
    let terrorData = [];
    let currentSort = { column: 'count', direction: 'desc' };
    let searchQuery = '';

    async function loadTerrorStats() {
        try {
            const response = await fetch('/api/v1/stats/terrors?limit=200');
            if (response.ok) {
                terrorData = await response.json();
                renderTable();
            }
        } catch (error) {
            console.error('Failed to load terror stats:', error);
            document.getElementById('terrorTableBody').innerHTML =
                '<tr><td colspan="3" class="error">Failed to load data</td></tr>';
        }
    }

    function renderTable() {
        const tbody = document.getElementById('terrorTableBody');
        let filtered = terrorData;

        // Apply search filter
        if (searchQuery) {
            filtered = terrorData.filter(t =>
                t.name.toLowerCase().includes(searchQuery.toLowerCase())
            );
        }

        // Apply sorting
        filtered.sort((a, b) => {
            let aVal, bVal;
            switch (currentSort.column) {
                case 'name':
                    aVal = a.name.toLowerCase();
                    bVal = b.name.toLowerCase();
                    break;
                case 'count':
                    aVal = a.encounter_count;
                    bVal = b.encounter_count;
                    break;
                case 'rate':
                    aVal = a.survival_rate;
                    bVal = b.survival_rate;
                    break;
            }
            if (aVal < bVal) return currentSort.direction === 'asc' ? -1 : 1;
            if (aVal > bVal) return currentSort.direction === 'asc' ? 1 : -1;
            return 0;
        });

        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="3" class="empty">No terrors found</td></tr>';
            return;
        }

        tbody.innerHTML = filtered.map(t => `
            <tr>
                <td class="terror-name">${escapeHtml(t.name)}</td>
                <td>${t.encounter_count.toLocaleString()}</td>
                <td>
                    <div class="survival-rate">
                        <div class="rate-bar" style="width: ${t.survival_rate}%"></div>
                        <span>${t.survival_rate.toFixed(1)}%</span>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    function escapeHtml(text) {
        const div = document.createElement('div');
        div.textContent = text;
        return div.innerHTML;
    }

    // Search functionality
    document.getElementById('terrorSearch').addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderTable();
    });

    // Sort functionality
    document.querySelectorAll('[data-sort]').forEach(th => {
        th.addEventListener('click', () => {
            const column = th.dataset.sort;
            if (currentSort.column === column) {
                currentSort.direction = currentSort.direction === 'asc' ? 'desc' : 'asc';
            } else {
                currentSort.column = column;
                currentSort.direction = 'desc';
            }

            // Update header styles
            document.querySelectorAll('[data-sort]').forEach(h => h.classList.remove('sort-asc', 'sort-desc'));
            th.classList.add(currentSort.direction === 'asc' ? 'sort-asc' : 'sort-desc');

            renderTable();
        });
    });

    loadTerrorStats();
</script>
{% endblock %}
