<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="googlebot" content="noindex, nofollow">
    <title>{% block title %}ToN Stats{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    {% if user %}
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">ToN Stats</a>
        </div>
        <div class="nav-menu">
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <a href="/terrors" class="nav-link">Terrors</a>
            <a href="/rounds" class="nav-link">Rounds</a>
            <a href="/api-keys" class="nav-link">API Keys</a>
        </div>
        <div class="nav-user">
            <span class="username">{{ user.username }}</span>
            <button id="logoutBtn" class="btn btn-outline">Logout</button>
        </div>
    </nav>
    {% endif %}

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>ToN Stats - Terror of Nowhere Statistics</p>
    </footer>

    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
