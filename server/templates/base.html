<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="googlebot" content="noindex, nofollow">
    <title>{% block title %}ToN Stats{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    {% if user %}
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">ToN Stats</a>
        </div>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="nav-menu" id="navMenu">
            <a href="/dashboard" class="nav-link" data-i18n="nav.dashboard">ダッシュボード</a>
            <a href="/round-log" class="nav-link" data-i18n="nav.roundLog">ラウンドログ</a>
            <a href="/instances" class="nav-link" data-i18n="nav.instances">インスタンス検索</a>
            <a href="/players" class="nav-link" data-i18n="nav.players">プレイヤー検索</a>
            <a href="/statistics" class="nav-link" data-i18n="nav.statistics">統計</a>
            <a href="/my-history" class="nav-link">マイログ</a>
            <a href="/settings" class="nav-link" data-i18n="nav.settings">設定</a>
        </div>
        <div class="nav-user">
            <select id="languageSelector" class="lang-selector">
                <option value="ja">日本語</option>
                <option value="en">English</option>
            </select>
            <span class="username">{{ user.username }}</span>
            <button id="logoutBtn" class="btn btn-outline" data-i18n="nav.logout">ログアウト</button>
        </div>
    </nav>
    {% endif %}

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>ToN Stats - Terror of Nowhere Statistics</p>
    </footer>

    <script src="/static/js/i18n.js"></script>
    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
