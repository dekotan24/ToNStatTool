<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <meta name="googlebot" content="noindex, nofollow">
    <title>{% block title %}ToN Stats{% endblock %}</title>
    <link rel="stylesheet" href="/static/css/style.css">
    {% block head %}{% endblock %}
</head>
<body>
    {% if user %}
    <nav class="navbar">
        <div class="nav-brand">
            <a href="/">ToN Stats</a>
        </div>
        <button class="nav-toggle" id="navToggle" aria-label="Toggle navigation">
            <span></span>
            <span></span>
            <span></span>
        </button>
        <div class="nav-user">
            <span class="username">{{ user.username }}</span>
            <button id="logoutBtn" class="btn btn-outline">Logout</button>
        </div>
        <div class="nav-menu" id="navMenu">
            <a href="/dashboard" class="nav-link">Dashboard</a>
            <a href="/round-log" class="nav-link">Round Log</a>
            <a href="/instances" class="nav-link">Instances</a>
            <a href="/players" class="nav-link">Players</a>
            <a href="/statistics" class="nav-link">Statistics</a>
            <a href="/my-history" class="nav-link">My Log</a>
            <a href="/settings" class="nav-link">Settings</a>
        </div>
    </nav>
    {% endif %}

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="footer">
        <p>ToN Stats - Terror of Nowhere Statistics</p>
    </footer>

    <script src="/static/js/app.js"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
