<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <title>新規登録 - ToN Stat Web</title>
    <link rel="stylesheet" href="/static/css/style.css?v=3">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="/static/js/i18n.js?v=3"></script>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>ToN Stat Web</h1>
                <select id="languageSelector" class="lang-selector auth-lang">
                    <option value="ja">日本語</option>
                    <option value="en">English</option>
                </select>
            </div>
            <h2 data-i18n="register.title">新規登録</h2>

            <div id="error-message" class="error-message hidden"></div>

            <form id="registerForm">
                <div class="form-group">
                    <label for="username" data-i18n="login.username">ユーザー名</label>
                    <input type="text" id="username" name="username" required
                           minlength="3" maxlength="50"
                           pattern="[a-zA-Z0-9_-]+"
                           title="Letters, numbers, underscore and hyphen only"
                           autocomplete="username">
                    <small data-i18n="register.usernameHint">3-50文字、英数字と_-のみ</small>
                </div>

                <div class="form-group">
                    <label for="email" data-i18n="register.email">メールアドレス</label>
                    <input type="email" id="email" name="email" required autocomplete="email">
                </div>

                <div class="form-group">
                    <label for="password" data-i18n="login.password">パスワード</label>
                    <input type="password" id="password" name="password" required
                           minlength="8" autocomplete="new-password">
                    <small data-i18n="register.passwordHint">8文字以上</small>
                </div>

                <div class="form-group">
                    <label for="confirmPassword" data-i18n="register.confirmPassword">パスワード確認</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required autocomplete="new-password">
                </div>

                <div class="form-group turnstile-container">
                    <div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}" data-callback="onTurnstileSuccess"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="submitBtn" disabled data-i18n="register.submit">登録</button>
            </form>

            <div class="auth-links">
                <p><span data-i18n="register.hasAccount">すでにアカウントをお持ちの方は</span> <a href="/login" data-i18n="register.login">ログイン</a></p>
            </div>
        </div>
    </div>

    <script>
        let turnstileToken = null;

        function onTurnstileSuccess(token) {
            turnstileToken = token;
            document.getElementById('submitBtn').disabled = false;
        }

        document.getElementById('registerForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const errorDiv = document.getElementById('error-message');
            const submitBtn = document.getElementById('submitBtn');
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (password !== confirmPassword) {
                errorDiv.textContent = t('register.passwordMismatch');
                errorDiv.classList.remove('hidden');
                return;
            }

            if (!turnstileToken) {
                errorDiv.textContent = t('register.completeVerification');
                errorDiv.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = t('register.creating');

            try {
                const response = await fetch('/api/v1/auth/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        email: document.getElementById('email').value,
                        password: password,
                        turnstile_token: turnstileToken
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    window.location.href = '/dashboard';
                } else {
                    errorDiv.textContent = data.detail || t('register.failed');
                    errorDiv.classList.remove('hidden');
                    // Reset Turnstile
                    if (typeof turnstile !== 'undefined') {
                        turnstile.reset();
                    }
                    turnstileToken = null;
                    submitBtn.disabled = true;
                }
            } catch (error) {
                errorDiv.textContent = t('common.connectionError');
                errorDiv.classList.remove('hidden');
            }

            submitBtn.textContent = t('register.submit');
        });
    </script>
</body>
</html>
