{% extends "base.html" %}

{% block title %}マイラウンド履歴 - ToN Stats{% endblock %}

{% block content %}
<div class="history-page">
    <div class="page-header">
        <h1 data-i18n="myHistory.title">マイラウンド履歴</h1>
        <p class="subtitle" data-i18n="myHistory.subtitle">アイテムと生存データを含む個人のラウンドログ</p>
    </div>

    <!-- Profile Status -->
    <div class="profile-status" id="profileStatus">
        <div class="loading" data-i18n="common.loading">読み込み中...</div>
    </div>

    <!-- Filter Section -->
    <div class="filter-section">
        <div class="filter-row">
            <div class="filter-group">
                <label for="filterSurvival" data-i18n="myHistory.filterSurvival">生存状態</label>
                <select id="filterSurvival" class="filter-select">
                    <option value="" data-i18n="myHistory.all">全て</option>
                    <option value="survived" data-i18n="myHistory.survived">生存</option>
                    <option value="died" data-i18n="myHistory.died">死亡</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filterRoundType" data-i18n="roundLog.filterRoundType">ラウンド種別</label>
                <select id="filterRoundType" class="filter-select">
                    <option value="" data-i18n="roundLog.allTypes">全ての種別</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="filterItem" data-i18n="myHistory.filterItem">アイテム</label>
                <input type="text" id="filterItem" class="filter-input" placeholder="アイテムで絞り込み..." data-i18n="myHistory.filterByItem">
            </div>
        </div>
    </div>

    <!-- Stats Summary -->
    <div class="stats-summary" id="statsSummary">
        <div class="stat-card mini">
            <div class="stat-value" id="totalRounds">-</div>
            <div class="stat-label" data-i18n="myHistory.totalRounds">総ラウンド数</div>
        </div>
        <div class="stat-card mini">
            <div class="stat-value" id="totalSurvivals">-</div>
            <div class="stat-label" data-i18n="myHistory.survivals">生存数</div>
        </div>
        <div class="stat-card mini">
            <div class="stat-value" id="survivalRate">-</div>
            <div class="stat-label" data-i18n="myHistory.survivalRate">生存率</div>
        </div>
        <div class="stat-card mini">
            <div class="stat-value" id="uniqueItems">-</div>
            <div class="stat-label" data-i18n="myHistory.uniqueItems">ユニークアイテム</div>
        </div>
    </div>

    <!-- History Table -->
    <div class="history-section">
        <div class="table-container">
            <table class="data-table" id="historyTable">
                <thead>
                    <tr>
                        <th data-i18n="table.time">時間</th>
                        <th data-i18n="table.roundType">種別</th>
                        <th data-i18n="table.map">マップ</th>
                        <th data-i18n="table.terrors">テラー</th>
                        <th data-i18n="myHistory.itemsHeld">所持アイテム</th>
                        <th data-i18n="table.players">人数</th>
                        <th data-i18n="table.result">結果</th>
                    </tr>
                </thead>
                <tbody id="historyBody">
                    <tr><td colspan="7" class="loading" data-i18n="common.loading">読み込み中...</td></tr>
                </tbody>
            </table>
        </div>

        <div class="pagination-controls">
            <button id="prevPage" class="btn btn-outline btn-small" disabled data-i18n="common.previous">前へ</button>
            <span id="pageInfo">ページ 1</span>
            <button id="nextPage" class="btn btn-outline btn-small" data-i18n="common.next">次へ</button>
        </div>
    </div>

</div>

<style>
.history-page {
    max-width: 1400px;
    margin: 0 auto;
}

.page-header {
    margin-bottom: 2rem;
}

.page-header h1 {
    margin-bottom: 0.5rem;
}

.subtitle {
    color: var(--text-secondary);
}

.profile-status {
    background: var(--bg-secondary);
    padding: 1.5rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    margin-bottom: 1.5rem;
}

.profile-status .loading {
    color: var(--text-secondary);
}

.profile-link-section {
    display: flex;
    align-items: center;
    justify-content: space-between;
}

.profile-link-section a {
    color: var(--accent);
}

.no-profile-message {
    color: var(--text-secondary);
}

.filter-section {
    background: var(--bg-secondary);
    padding: 1.5rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    margin-bottom: 1.5rem;
}

.filter-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
}

.filter-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.filter-group label {
    color: var(--text-secondary);
    font-size: 0.875rem;
}

.filter-input,
.filter-select {
    padding: 0.75rem 1rem;
    background-color: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-primary);
    font-size: 1rem;
}

.filter-input:focus,
.filter-select:focus {
    outline: none;
    border-color: var(--accent);
}

.stats-summary {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
    gap: 1rem;
    margin-bottom: 1.5rem;
}

.stat-card.mini {
    background: var(--bg-secondary);
    padding: 1rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    text-align: center;
}

.stat-card.mini .stat-value {
    font-size: 1.5rem;
    font-weight: bold;
    color: var(--accent);
}

.stat-card.mini .stat-label {
    font-size: 0.75rem;
    color: var(--text-secondary);
    margin-top: 0.25rem;
}

.history-section {
    background: var(--bg-secondary);
    padding: 1.5rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    margin-bottom: 1.5rem;
}

.pagination-controls {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 1rem;
    margin-top: 1rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
}

#pageInfo {
    color: var(--text-secondary);
}

.survival-badge {
    display: inline-block;
    padding: 0.25rem 0.5rem;
    border-radius: 4px;
    font-size: 0.875rem;
    font-weight: 500;
}

.survival-badge.survived {
    background: rgba(34, 197, 94, 0.2);
    color: var(--success);
}

.survival-badge.died {
    background: rgba(239, 68, 68, 0.2);
    color: var(--error);
}

.items-cell {
    max-width: 200px;
}

.items-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem;
}

.item-tag {
    display: inline-block;
    padding: 0.125rem 0.5rem;
    background: var(--accent);
    color: white;
    border-radius: 4px;
    font-size: 0.75rem;
}

.btn-small {
    padding: 0.5rem 1rem;
    font-size: 0.875rem;
}

@media (max-width: 768px) {
    .filter-row {
        grid-template-columns: 1fr;
    }

    .stats-summary {
        grid-template-columns: repeat(2, 1fr);
    }
}
</style>
{% endblock %}

{% block scripts %}
<script>
    let allHistory = [];
    let filteredHistory = [];
    let currentPage = 1;
    const perPage = 20;
    let playerProfile = null;

    // Load profile
    async function loadProfile() {
        try {
            const res = await fetch('/api/v1/profile/me');
            if (res.ok) {
                playerProfile = await res.json();
                if (playerProfile) {
                    renderProfileStatus(playerProfile);
                    loadHistory();
                    loadRoundTypes();
                } else {
                    document.getElementById('profileStatus').innerHTML = `
                        <div class="no-profile-message">
                            <p>You don't have a player profile yet. Play some rounds with the C# app to create one!</p>
                            <p><small>Make sure your C# app is sending player data with your VRChat name.</small></p>
                        </div>
                    `;
                    document.getElementById('historyBody').innerHTML = `<tr><td colspan="7" class="empty">${t('myHistory.noProfileFound')}</td></tr>`;
                }
            }
        } catch (error) {
            console.error('Failed to load profile:', error);
        }
    }

    function renderProfileStatus(profile) {
        const avatarUrl = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(profile.avatar_seed || profile.vrchat_name)}`;
        const isPublicText = profile.is_public ? t('myHistory.publicProfile') : t('myHistory.privateProfile');

        document.getElementById('profileStatus').innerHTML = `
            <div class="profile-link-section">
                <div style="display: flex; align-items: center; gap: 1rem;">
                    <img src="${avatarUrl}" alt="Avatar" style="width: 48px; height: 48px; border-radius: 50%;">
                    <div>
                        <strong>${escapeHtml(profile.vrchat_name)}</strong>
                        <span style="color: var(--text-secondary); margin-left: 0.5rem;">
                            ${isPublicText}
                        </span>
                    </div>
                </div>
                <div style="display: flex; gap: 0.5rem;">
                    ${profile.is_public ? `<a href="/player/${encodeURIComponent(profile.username)}" class="btn btn-outline">${t('myHistory.viewPublicProfile')}</a>` : ''}
                    <a href="/settings" class="btn btn-outline">${t('nav.settings')}</a>
                </div>
            </div>
        `;

        // Update stats
        document.getElementById('totalRounds').textContent = profile.total_rounds;
        document.getElementById('totalSurvivals').textContent = profile.total_survivals;
        document.getElementById('survivalRate').textContent = profile.survival_rate + '%';
    }

    async function loadHistory() {
        if (!playerProfile) return;

        try {
            const res = await fetch(`/api/v1/profile/player/${encodeURIComponent(playerProfile.username)}/history?limit=500`);
            if (res.ok) {
                allHistory = await res.json();
                applyFilters();
                calculateUniqueItems();
            }
        } catch (error) {
            console.error('Failed to load history:', error);
        }
    }

    async function loadRoundTypes() {
        try {
            const res = await fetch('/api/v1/stats/filter-options');
            if (res.ok) {
                const options = await res.json();
                const select = document.getElementById('filterRoundType');
                options.round_types.forEach(rt => {
                    const option = document.createElement('option');
                    option.value = rt;
                    option.textContent = rt;
                    select.appendChild(option);
                });
            }
        } catch (error) {
            console.error('Failed to load round types:', error);
        }
    }

    function calculateUniqueItems() {
        const uniqueItems = new Set();
        allHistory.forEach(h => {
            if (h.items) {
                h.items.forEach(item => uniqueItems.add(item));
            }
        });
        document.getElementById('uniqueItems').textContent = uniqueItems.size;
    }

    function applyFilters() {
        const survivalFilter = document.getElementById('filterSurvival').value;
        const roundTypeFilter = document.getElementById('filterRoundType').value;
        const itemFilter = document.getElementById('filterItem').value.toLowerCase();

        filteredHistory = allHistory.filter(h => {
            // Survival filter
            if (survivalFilter === 'survived' && !h.survived) return false;
            if (survivalFilter === 'died' && h.survived) return false;

            // Round type filter
            if (roundTypeFilter && h.round_type !== roundTypeFilter) return false;

            // Item filter
            if (itemFilter && (!h.items || !h.items.some(i => i.toLowerCase().includes(itemFilter)))) return false;

            return true;
        });

        currentPage = 1;
        renderHistory();
    }

    function renderHistory() {
        const tbody = document.getElementById('historyBody');
        const start = (currentPage - 1) * perPage;
        const end = start + perPage;
        const pageData = filteredHistory.slice(start, end);

        if (pageData.length === 0) {
            tbody.innerHTML = `<tr><td colspan="7" class="empty">${t('myHistory.noMatchingRounds')}</td></tr>`;
            document.getElementById('prevPage').disabled = true;
            document.getElementById('nextPage').disabled = true;
            document.getElementById('pageInfo').textContent = t('common.noResults');
            return;
        }

        tbody.innerHTML = pageData.map(h => `
            <tr>
                <td>${new Date(h.started_at).toLocaleString('ja-JP')}</td>
                <td><span class="round-type">${escapeHtml(h.round_type)}</span></td>
                <td>${escapeHtml(h.map_name || '-')}</td>
                <td>${h.terrors.length > 0 ? h.terrors.slice(0, 2).map(terror => escapeHtml(terror)).join(', ') + (h.terrors.length > 2 ? '...' : '') : '-'}</td>
                <td class="items-cell">
                    ${h.items && h.items.length > 0 ? `
                        <div class="items-list">
                            ${h.items.map(i => `<span class="item-tag">${escapeHtml(i)}</span>`).join('')}
                        </div>
                    ` : '-'}
                </td>
                <td>${h.survivor_count}/${h.player_count}</td>
                <td>
                    <span class="survival-badge ${h.survived ? 'survived' : 'died'}">
                        ${h.survived ? t('profile.survived') : t('profile.died')}
                    </span>
                </td>
            </tr>
        `).join('');

        // Update pagination
        const totalPages = Math.ceil(filteredHistory.length / perPage);
        document.getElementById('prevPage').disabled = currentPage <= 1;
        document.getElementById('nextPage').disabled = currentPage >= totalPages;
        document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages} (${filteredHistory.length} rounds)`;
    }

    // Filter event listeners
    document.getElementById('filterSurvival').addEventListener('change', applyFilters);
    document.getElementById('filterRoundType').addEventListener('change', applyFilters);
    document.getElementById('filterItem').addEventListener('input', debounce(applyFilters, 300));

    // Pagination
    document.getElementById('prevPage').addEventListener('click', () => {
        if (currentPage > 1) {
            currentPage--;
            renderHistory();
        }
    });

    document.getElementById('nextPage').addEventListener('click', () => {
        const totalPages = Math.ceil(filteredHistory.length / perPage);
        if (currentPage < totalPages) {
            currentPage++;
            renderHistory();
        }
    });

    // Debounce helper
    function debounce(func, wait) {
        let timeout;
        return function executedFunction(...args) {
            const later = () => {
                clearTimeout(timeout);
                func(...args);
            };
            clearTimeout(timeout);
            timeout = setTimeout(later, wait);
        };
    }

    // Initial load
    loadProfile();
</script>
{% endblock %}
