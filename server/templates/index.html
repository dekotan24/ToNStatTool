{% extends "base.html" %}

{% block title %}ToN Stat Web{% endblock %}

{% block content %}
<div class="welcome">
    <h1 data-i18n="index.welcome">ようこそ、{{ user.username }}さん！</h1>
    <p data-i18n="index.subtitle">Terror of Nowhere 統計ダッシュボード</p>
    <div class="quick-links">
        <a href="/dashboard" class="btn btn-primary" data-i18n="index.goToDashboard">ダッシュボードへ</a>
    </div>
</div>
{% endblock %}

{% block scripts %}
<script>
    // Dynamic welcome message with username
    document.addEventListener('DOMContentLoaded', () => {
        const welcomeEl = document.querySelector('h1[data-i18n="index.welcome"]');
        if (welcomeEl) {
            const username = "{{ user.username }}";
            const lang = getCurrentLanguage();
            if (lang === 'en') {
                welcomeEl.textContent = `Welcome, ${username}!`;
            } else {
                welcomeEl.textContent = `ようこそ、${username}さん！`;
            }
        }
    });
</script>
{% endblock %}
