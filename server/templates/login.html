<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <title>ログイン - ToN Stat Web</title>
    <link rel="stylesheet" href="/static/css/style.css?v=3">
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
    <script src="/static/js/i18n.js?v=3"></script>
</head>
<body class="auth-page">
    <div class="auth-container">
        <div class="auth-card">
            <div class="auth-header">
                <h1>ToN Stat Web</h1>
                <select id="languageSelector" class="lang-selector auth-lang">
                    <option value="ja">日本語</option>
                    <option value="en">English</option>
                </select>
            </div>
            <h2 data-i18n="login.title">ログイン</h2>

            <div id="error-message" class="error-message hidden"></div>

            <form id="loginForm">
                <div class="form-group">
                    <label for="username" data-i18n="login.username">ユーザー名</label>
                    <input type="text" id="username" name="username" required autocomplete="username">
                </div>

                <div class="form-group">
                    <label for="password" data-i18n="login.password">パスワード</label>
                    <input type="password" id="password" name="password" required autocomplete="current-password">
                </div>

                <div class="form-group turnstile-container">
                    <div class="cf-turnstile" data-sitekey="{{ turnstile_site_key }}" data-callback="onTurnstileSuccess"></div>
                </div>

                <button type="submit" class="btn btn-primary btn-full" id="submitBtn" disabled data-i18n="login.submit">ログイン</button>
            </form>

            <div class="auth-links">
                <p><span data-i18n="login.noAccount">アカウントをお持ちでない方は</span> <a href="/register" data-i18n="login.register">新規登録</a></p>
            </div>
        </div>
    </div>

    <script>
        let turnstileToken = null;

        function onTurnstileSuccess(token) {
            turnstileToken = token;
            document.getElementById('submitBtn').disabled = false;
        }

        document.getElementById('loginForm').addEventListener('submit', async (e) => {
            e.preventDefault();

            const errorDiv = document.getElementById('error-message');
            const submitBtn = document.getElementById('submitBtn');

            if (!turnstileToken) {
                errorDiv.textContent = t('login.completeVerification');
                errorDiv.classList.remove('hidden');
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = t('login.loggingIn');

            try {
                const response = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        username: document.getElementById('username').value,
                        password: document.getElementById('password').value,
                        turnstile_token: turnstileToken
                    })
                });

                const data = await response.json();

                if (response.ok) {
                    window.location.href = '/dashboard';
                } else {
                    errorDiv.textContent = data.detail || t('login.failed');
                    errorDiv.classList.remove('hidden');
                    // Reset Turnstile
                    if (typeof turnstile !== 'undefined') {
                        turnstile.reset();
                    }
                    turnstileToken = null;
                    submitBtn.disabled = true;
                }
            } catch (error) {
                errorDiv.textContent = t('common.connectionError');
                errorDiv.classList.remove('hidden');
            }

            submitBtn.textContent = t('login.submit');
        });
    </script>
</body>
</html>
