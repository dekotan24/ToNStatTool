{% extends "base.html" %}

{% block title %}インスタンス詳細 - ToN Stats{% endblock %}

{% block content %}
<div class="page-content">
    <div class="page-header">
        <a href="/instances" class="back-link" data-i18n="instanceDetail.backToInstances">&larr; インスタンス一覧に戻る</a>
        <h1 data-i18n="instanceDetail.title">インスタンス詳細</h1>
    </div>

    <div id="loading" class="loading-state" data-i18n="common.loading">読み込み中...</div>
    <div id="error" class="error-state" style="display: none;"></div>

    <div id="instanceContent" style="display: none;">
        <!-- Instance Info -->
        <div class="instance-info section">
            <div class="info-row">
                <div class="info-item">
                    <span class="info-label" data-i18n="instanceDetail.totalRounds">総ラウンド数</span>
                    <span class="info-value" id="totalRounds">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label" data-i18n="instanceDetail.created">作成日時</span>
                    <span class="info-value" id="createdAt">-</span>
                </div>
                <div class="info-item">
                    <span class="info-label" data-i18n="instanceDetail.lastActivity">最終アクティビティ</span>
                    <span class="info-value" id="lastActivity">-</span>
                </div>
                <div class="info-item">
                    <a id="joinInstanceBtn" href="#" target="_blank" class="btn btn-primary join-btn">
                        <span class="btn-icon">▶</span> <span data-i18n="instanceDetail.joinInstance">インスタンスに参加</span>
                    </a>
                </div>
            </div>
        </div>

        <!-- Stats Row -->
        <div class="stats-row">
            <!-- Round Types -->
            <div class="section stats-card">
                <h2 data-i18n="instanceDetail.roundTypes">ラウンド種別</h2>
                <div class="stats-list" id="roundTypeStats"></div>
            </div>

            <!-- Maps -->
            <div class="section stats-card">
                <h2 data-i18n="instanceDetail.maps">マップ</h2>
                <div class="stats-list" id="mapStats"></div>
            </div>

            <!-- Terrors -->
            <div class="section stats-card">
                <h2 data-i18n="instanceDetail.terrors">テラー</h2>
                <div class="stats-list" id="terrorStats"></div>
            </div>
        </div>

        <!-- Round History -->
        <div class="section">
            <h2><span data-i18n="instanceDetail.roundHistory">ラウンド履歴</span> <span class="subtitle" data-i18n="instanceDetail.last50">(直近50件)</span></h2>
            <div class="table-container">
                <table class="data-table">
                    <thead>
                        <tr>
                            <th data-i18n="table.time">時間</th>
                            <th data-i18n="table.roundType">種別</th>
                            <th data-i18n="table.map">マップ</th>
                            <th data-i18n="table.terrors">テラー</th>
                            <th data-i18n="table.players">人数</th>
                        </tr>
                    </thead>
                    <tbody id="roundHistory">
                        <tr><td colspan="5" class="empty" data-i18n="common.noRoundsYet">まだラウンドが記録されていません</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<style>
.page-header {
    margin-bottom: 1.5rem;
}

.back-link {
    display: inline-block;
    margin-bottom: 0.5rem;
    color: var(--text-secondary);
    font-size: 0.875rem;
}

.back-link:hover {
    color: var(--accent);
}

.loading-state,
.error-state {
    text-align: center;
    padding: 3rem;
    color: var(--text-secondary);
}

.error-state {
    color: var(--error);
}

.section {
    background: var(--bg-secondary);
    padding: 1.5rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    margin-bottom: 1.5rem;
}

.instance-info .info-row {
    display: flex;
    flex-wrap: wrap;
    gap: 2rem;
    align-items: center;
}

.info-item {
    display: flex;
    flex-direction: column;
    gap: 0.25rem;
}

.info-label {
    font-size: 0.75rem;
    color: var(--text-secondary);
    text-transform: uppercase;
}

.info-value {
    font-size: 1.25rem;
    font-weight: 600;
    color: var(--text-primary);
}

.join-btn {
    display: inline-flex;
    align-items: center;
    gap: 0.5rem;
}

.btn-icon {
    font-size: 0.75rem;
}

.stats-row {
    display: flex;
    gap: 1.5rem;
    margin-bottom: 1.5rem;
}

.stats-card {
    flex: 1;
    min-width: 200px;
    max-height: 300px;
    display: flex;
    flex-direction: column;
}

.stats-card h2 {
    margin-bottom: 1rem;
    font-size: 1rem;
}

.stats-list {
    flex: 1;
    overflow-y: auto;
    padding-right: 0.5rem;
}

.stat-item {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 0.5rem 0;
    border-bottom: 1px solid var(--border);
}

.stat-item:last-child {
    border-bottom: none;
}

.stat-name {
    color: var(--text-primary);
    font-size: 0.875rem;
}

.stat-count {
    color: var(--text-secondary);
    font-size: 0.875rem;
    font-weight: 500;
}

.stat-percent {
    color: var(--text-secondary);
    font-size: 0.75rem;
    opacity: 0.8;
}

.section h2 {
    margin-bottom: 1rem;
    font-size: 1.25rem;
}

.section h2 .subtitle {
    font-size: 0.875rem;
    font-weight: 400;
    color: var(--text-secondary);
}

@media (max-width: 1024px) {
    .stats-row {
        flex-direction: column;
    }

    .stats-card {
        max-height: 250px;
    }
}

@media (max-width: 768px) {
    .instance-info .info-row {
        gap: 1rem;
    }

    .info-item {
        flex: 1 1 45%;
    }

    .info-value {
        font-size: 1rem;
    }
}
</style>
{% endblock %}

{% block scripts %}
<script>
    const instanceShortId = "{{ instance_short_id }}";

    function createVRChatLaunchUrl(instanceIdStr) {
        if (!instanceIdStr) return null;

        const parts = instanceIdStr.split(':');
        if (parts.length >= 2) {
            const worldId = parts[0];
            const instId = parts.slice(1).join(':');
            return `https://vrchat.com/home/launch?worldId=${encodeURIComponent(worldId)}&instanceId=${encodeURIComponent(instId)}`;
        }
        return null;
    }

    async function loadInstanceDetail() {
        try {
            const res = await fetch(`/api/v1/stats/instance/${encodeURIComponent(instanceShortId)}`);

            if (!res.ok) {
                if (res.status === 404) {
                    document.getElementById('loading').style.display = 'none';
                    document.getElementById('error').style.display = 'block';
                    document.getElementById('error').textContent = 'Instance not found';
                    return;
                }
                throw new Error('Failed to load instance');
            }

            const data = await res.json();

            // Hide loading, show content
            document.getElementById('loading').style.display = 'none';
            document.getElementById('instanceContent').style.display = 'block';

            // Instance info
            document.getElementById('totalRounds').textContent = data.total_rounds;
            document.getElementById('createdAt').textContent = new Date(data.created_at).toLocaleString('ja-JP');
            document.getElementById('lastActivity').textContent = new Date(data.last_activity_at).toLocaleString('ja-JP');

            // Join button
            const launchUrl = createVRChatLaunchUrl(data.instance_id);
            const joinBtn = document.getElementById('joinInstanceBtn');
            if (launchUrl) {
                joinBtn.href = launchUrl;
                joinBtn.title = data.instance_id;
            } else {
                joinBtn.style.display = 'none';
            }

            // Round type stats with percentage
            const roundTypeStats = document.getElementById('roundTypeStats');
            const roundTypes = Object.entries(data.round_type_stats).sort((a, b) => b[1] - a[1]);
            const totalRoundTypes = roundTypes.reduce((sum, [_, count]) => sum + count, 0);
            if (roundTypes.length > 0) {
                roundTypeStats.innerHTML = roundTypes.map(([type, count]) => {
                    const percentage = totalRoundTypes > 0 ? ((count / totalRoundTypes) * 100).toFixed(1) : 0;
                    return `
                    <div class="stat-item">
                        <span class="stat-name">${escapeHtml(type)}</span>
                        <span class="stat-count">${count} <span class="stat-percent">(${percentage}%)</span></span>
                    </div>
                `}).join('');
            } else {
                roundTypeStats.innerHTML = '<div class="stat-item"><span class="stat-name">No data</span></div>';
            }

            // Map stats
            const mapStats = document.getElementById('mapStats');
            const maps = Object.entries(data.map_stats).sort((a, b) => b[1] - a[1]);
            if (maps.length > 0) {
                mapStats.innerHTML = maps.map(([name, count]) => `
                    <div class="stat-item">
                        <span class="stat-name">${escapeHtml(name)}</span>
                        <span class="stat-count">${count}</span>
                    </div>
                `).join('');
            } else {
                mapStats.innerHTML = '<div class="stat-item"><span class="stat-name">No data</span></div>';
            }

            // Terror stats
            const terrorStats = document.getElementById('terrorStats');
            if (data.terror_stats.length > 0) {
                terrorStats.innerHTML = data.terror_stats.map(t => `
                    <div class="stat-item">
                        <span class="stat-name">${escapeHtml(t.terror_name)}</span>
                        <span class="stat-count">${t.encounter_count}</span>
                    </div>
                `).join('');
            } else {
                terrorStats.innerHTML = '<div class="stat-item"><span class="stat-name">No data</span></div>';
            }

            // Round history
            const roundHistory = document.getElementById('roundHistory');
            if (data.rounds.length > 0) {
                roundHistory.innerHTML = data.rounds.map(r => `
                    <tr>
                        <td>${new Date(r.started_at).toLocaleString('ja-JP')}</td>
                        <td><span class="round-type">${escapeHtml(r.round_type)}</span></td>
                        <td>${escapeHtml(r.map_name || '-')}</td>
                        <td>${r.terrors.length > 0
                            ? r.terrors.slice(0, 3).map(t => escapeHtml(t)).join(', ') + (r.terrors.length > 3 ? '...' : '')
                            : '-'}</td>
                        <td>${r.player_count}</td>
                    </tr>
                `).join('');
            } else {
                roundHistory.innerHTML = '<tr><td colspan="5" class="empty">No rounds recorded</td></tr>';
            }

        } catch (error) {
            console.error('Failed to load instance:', error);
            document.getElementById('loading').style.display = 'none';
            document.getElementById('error').style.display = 'block';
            document.getElementById('error').textContent = 'Failed to load instance details';
        }
    }

    // Initial load
    loadInstanceDetail();

    // Auto refresh every 30 seconds
    setInterval(loadInstanceDetail, 30000);
</script>
{% endblock %}
