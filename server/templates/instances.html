{% extends "base.html" %}

{% block title %}Instance Search - ToN Stats{% endblock %}

{% block content %}
<div class="page-content">
    <h1>Instance Search</h1>

    <!-- Search Filters -->
    <div class="search-filters">
        <div class="filter-row">
            <div class="filter-group">
                <label for="instanceIdFilter">Instance ID</label>
                <input type="text" id="instanceIdFilter" class="filter-input" placeholder="e.g., 12345">
            </div>
            <div class="filter-group">
                <label for="roundTypeFilter">Round Type</label>
                <select id="roundTypeFilter" class="filter-select">
                    <option value="">All Types</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="terrorFilter">Terror</label>
                <input type="text" id="terrorFilter" class="filter-input" placeholder="Search terror name..." maxlength="100">
            </div>
            <div class="filter-group">
                <label for="mapFilter">Map</label>
                <select id="mapFilter" class="filter-select">
                    <option value="">All Maps</option>
                </select>
            </div>
        </div>
        <div class="filter-actions">
            <button id="searchBtn" class="btn btn-primary">Search</button>
            <button id="clearBtn" class="btn btn-outline">Clear</button>
        </div>
    </div>

    <!-- Results -->
    <div class="search-results">
        <div class="results-header">
            <span id="resultsCount">-</span>
        </div>
        <div class="table-container">
            <table class="data-table" id="instancesTable">
                <thead>
                    <tr>
                        <th>Instance</th>
                        <th>Round Type</th>
                        <th>Terrors</th>
                        <th>Map</th>
                        <th>Players</th>
                        <th>Rounds</th>
                        <th>Last Activity</th>
                    </tr>
                </thead>
                <tbody id="instancesBody">
                    <tr><td colspan="7" class="empty">Enter search criteria and click Search</td></tr>
                </tbody>
            </table>
        </div>

        <!-- Pagination -->
        <div class="pagination" id="pagination" style="display: none;">
            <button id="prevPage" class="btn btn-outline btn-small">Previous</button>
            <span id="pageInfo">Page 1 of 1</span>
            <button id="nextPage" class="btn btn-outline btn-small">Next</button>
        </div>
    </div>
</div>

<style>
.search-filters {
    background: var(--bg-secondary);
    padding: 1.5rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    margin-bottom: 2rem;
}

.filter-row {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
    gap: 1rem;
    margin-bottom: 1rem;
}

.filter-group {
    display: flex;
    flex-direction: column;
    gap: 0.5rem;
}

.filter-group label {
    color: var(--text-secondary);
    font-size: 0.875rem;
}

.filter-input,
.filter-select {
    padding: 0.75rem 1rem;
    background-color: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-primary);
    font-size: 1rem;
}

.filter-input:focus,
.filter-select:focus {
    outline: none;
    border-color: var(--accent);
}

.filter-select {
    cursor: pointer;
}

.filter-select option {
    background-color: var(--bg-tertiary);
    color: var(--text-primary);
}

.filter-actions {
    display: flex;
    gap: 1rem;
}

.search-results {
    background: var(--bg-secondary);
    padding: 1.5rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
}

.results-header {
    margin-bottom: 1rem;
    color: var(--text-secondary);
}

.pagination {
    display: flex;
    justify-content: center;
    align-items: center;
    gap: 1rem;
    margin-top: 1.5rem;
    padding-top: 1rem;
    border-top: 1px solid var(--border);
}

#pageInfo {
    color: var(--text-secondary);
}

.btn-small {
    padding: 0.5rem 1rem;
    font-size: 0.875rem;
}

.instance-id-cell {
    font-family: monospace;
    font-size: 0.8rem;
    max-width: 250px;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
}

.instance-link {
    display: inline-flex;
    align-items: center;
    gap: 0.25rem;
    padding: 0.25rem 0.5rem;
    background: var(--accent);
    color: white;
    border-radius: 4px;
    font-size: 0.75rem;
    text-decoration: none;
    transition: background 0.2s;
}

.instance-link:hover {
    background: var(--accent-hover);
    color: white;
}

.instance-link::before {
    content: "▶";
    font-size: 0.625rem;
}

.player-count {
    font-weight: 500;
    color: var(--text-secondary);
}

@media (max-width: 768px) {
    .filter-row {
        grid-template-columns: 1fr;
    }

    .filter-actions {
        flex-direction: column;
    }

    .filter-actions .btn {
        width: 100%;
    }
}
</style>
{% endblock %}

{% block scripts %}
<script>
    let currentPage = 1;
    let totalPages = 1;
    let perPage = 20;

    function createInstanceLink(instanceId) {
        if (!instanceId) return '-';

        // Extract short instance number from instance_id (e.g., wrld_xxx:12345~region(...) -> 12345)
        let shortId = null;
        const parts = instanceId.split(':');
        if (parts.length >= 2) {
            shortId = parts.slice(1).join(':').split('~')[0];
        }

        if (!shortId) return '-';

        return `<a href="/instance/${encodeURIComponent(shortId)}" class="instance-link" title="${escapeHtml(instanceId)}">${escapeHtml(shortId)}</a>`;
    }

    // Load filter options on page load
    async function loadFilterOptions() {
        try {
            const res = await fetch('/api/v1/stats/filter-options');
            if (res.ok) {
                const options = await res.json();

                // Populate round types
                const roundTypeSelect = document.getElementById('roundTypeFilter');
                options.round_types.forEach(rt => {
                    const option = document.createElement('option');
                    option.value = rt;
                    option.textContent = rt;
                    roundTypeSelect.appendChild(option);
                });

                // Terror is now a text input, no need to populate

                // Populate maps
                const mapSelect = document.getElementById('mapFilter');
                options.maps.forEach(m => {
                    const option = document.createElement('option');
                    option.value = m;
                    option.textContent = m;
                    mapSelect.appendChild(option);
                });
            }
        } catch (error) {
            console.error('Failed to load filter options:', error);
        }
    }

    // Sanitize input to prevent injection
    function sanitizeInput(str) {
        if (!str) return '';
        return str.replace(/[<>\"'&]/g, '').trim().substring(0, 100);
    }

    // Search instances
    async function searchInstances(page = 1) {
        const instanceId = sanitizeInput(document.getElementById('instanceIdFilter').value);
        const roundType = document.getElementById('roundTypeFilter').value;
        const terror = sanitizeInput(document.getElementById('terrorFilter').value);
        const mapName = document.getElementById('mapFilter').value;

        const params = new URLSearchParams();
        if (instanceId) params.append('instance_id', instanceId);
        if (roundType) params.append('round_type', roundType);
        if (terror) params.append('terror', terror);
        if (mapName) params.append('map_name', mapName);
        params.append('page', page);
        params.append('per_page', perPage);

        const tbody = document.getElementById('instancesBody');
        tbody.innerHTML = '<tr><td colspan="7" class="loading">Searching...</td></tr>';

        try {
            const res = await fetch(`/api/v1/stats/instances/search?${params}`);
            if (res.ok) {
                const data = await res.json();
                currentPage = data.page;
                totalPages = Math.ceil(data.total / data.per_page) || 1;

                document.getElementById('resultsCount').textContent =
                    `${data.total} instance${data.total !== 1 ? 's' : ''} found`;

                if (data.results.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="7" class="empty">No instances found</td></tr>';
                    document.getElementById('pagination').style.display = 'none';
                } else {
                    tbody.innerHTML = data.results.map(i => `
                        <tr>
                            <td>${createInstanceLink(i.instance_id)}</td>
                            <td><span class="round-type">${escapeHtml(i.latest_round_type || '-')}</span></td>
                            <td>${i.latest_terrors && i.latest_terrors.length > 0
                                ? i.latest_terrors.slice(0, 2).map(t => escapeHtml(t)).join(', ') + (i.latest_terrors.length > 2 ? '...' : '')
                                : '-'}</td>
                            <td>${escapeHtml(i.latest_map || '-')}</td>
                            <td><span class="player-count">${i.latest_player_count}</span></td>
                            <td>${i.total_rounds}</td>
                            <td>${new Date(i.last_activity_at).toLocaleString('ja-JP')}</td>
                        </tr>
                    `).join('');

                    // Show pagination
                    const pagination = document.getElementById('pagination');
                    if (totalPages > 1) {
                        pagination.style.display = 'flex';
                        document.getElementById('pageInfo').textContent = `Page ${currentPage} of ${totalPages}`;
                        document.getElementById('prevPage').disabled = currentPage <= 1;
                        document.getElementById('nextPage').disabled = currentPage >= totalPages;
                    } else {
                        pagination.style.display = 'none';
                    }
                }
            }
        } catch (error) {
            console.error('Search failed:', error);
            tbody.innerHTML = '<tr><td colspan="7" class="error">Search failed</td></tr>';
        }
    }

    // Clear filters
    function clearFilters() {
        document.getElementById('instanceIdFilter').value = '';
        document.getElementById('roundTypeFilter').value = '';
        document.getElementById('terrorFilter').value = '';
        document.getElementById('mapFilter').value = '';
        document.getElementById('resultsCount').textContent = '-';
        document.getElementById('instancesBody').innerHTML =
            '<tr><td colspan="7" class="empty">Enter search criteria and click Search</td></tr>';
        document.getElementById('pagination').style.display = 'none';
        currentPage = 1;
    }

    // Event listeners
    document.getElementById('searchBtn').addEventListener('click', () => searchInstances(1));
    document.getElementById('clearBtn').addEventListener('click', clearFilters);
    document.getElementById('prevPage').addEventListener('click', () => searchInstances(currentPage - 1));
    document.getElementById('nextPage').addEventListener('click', () => searchInstances(currentPage + 1));

    // Enter key to search
    document.querySelectorAll('.filter-input, .filter-select').forEach(el => {
        el.addEventListener('keypress', (e) => {
            if (e.key === 'Enter') searchInstances(1);
        });
    });

    // Initial load
    loadFilterOptions();
</script>
{% endblock %}
