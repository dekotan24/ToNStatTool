{% extends "base.html" %}

{% block title %}{{ username }} - ToN Stats{% endblock %}

{% block content %}
<div class="profile-page">
    <!-- Profile Header -->
    <div class="profile-header" id="profileHeader">
        <div class="profile-loading" data-i18n="common.loading">読み込み中...</div>
    </div>

    <!-- Stats Tabs -->
    <div class="stats-tabs">
        <button class="tab-btn active" data-tab="overview" data-i18n="profile.overview">概要</button>
        <button class="tab-btn" data-tab="history" data-i18n="profile.history">ラウンド履歴</button>
        <button class="tab-btn" data-tab="items" data-i18n="profile.items">アイテム</button>
        <button class="tab-btn" data-tab="terrors" data-i18n="profile.terrors">テラー</button>
    </div>

    <!-- Tab Content -->
    <div class="tab-content">
        <!-- Overview Tab -->
        <div class="tab-pane active" id="overview">
            <div class="stats-grid">
                <div class="stats-section">
                    <h3 data-i18n="profile.roundTypeStats">ラウンド種別統計</h3>
                    <div class="table-container">
                        <table class="data-table" id="roundTypeStatsTable">
                            <thead>
                                <tr>
                                    <th data-i18n="table.roundType">ラウンド種別</th>
                                    <th data-i18n="table.played">プレイ数</th>
                                    <th data-i18n="table.survived">生存数</th>
                                    <th data-i18n="table.rate">生存率</th>
                                </tr>
                            </thead>
                            <tbody id="roundTypeStatsBody">
                                <tr><td colspan="4" class="loading" data-i18n="common.loading">読み込み中...</td></tr>
                            </tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>

        <!-- History Tab -->
        <div class="tab-pane" id="history">
            <div class="table-container">
                <table class="data-table" id="historyTable">
                    <thead>
                        <tr>
                            <th data-i18n="table.time">時間</th>
                            <th data-i18n="table.roundType">ラウンド種別</th>
                            <th data-i18n="table.map">マップ</th>
                            <th data-i18n="table.terrors">テラー</th>
                            <th data-i18n="table.items">アイテム</th>
                            <th data-i18n="table.result">結果</th>
                        </tr>
                    </thead>
                    <tbody id="historyBody">
                        <tr><td colspan="6" class="loading" data-i18n="common.loading">読み込み中...</td></tr>
                    </tbody>
                </table>
            </div>
            <div class="load-more">
                <button id="loadMoreHistory" class="btn btn-outline" style="display: none;" data-i18n="profile.loadMore">もっと読み込む</button>
            </div>
        </div>

        <!-- Items Tab -->
        <div class="tab-pane" id="items">
            <div class="table-container">
                <table class="data-table" id="itemsTable">
                    <thead>
                        <tr>
                            <th data-i18n="table.items">アイテム</th>
                            <th data-i18n="table.timesHeld">所持回数</th>
                            <th data-i18n="table.survivals">生存数</th>
                            <th data-i18n="table.survivalRate">生存率</th>
                        </tr>
                    </thead>
                    <tbody id="itemsBody">
                        <tr><td colspan="4" class="loading" data-i18n="common.loading">読み込み中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Terrors Tab -->
        <div class="tab-pane" id="terrors">
            <div class="table-container">
                <table class="data-table" id="terrorsTable">
                    <thead>
                        <tr>
                            <th data-i18n="table.terrors">テラー</th>
                            <th data-i18n="table.encounters">遭遇数</th>
                            <th data-i18n="table.survivals">生存数</th>
                            <th data-i18n="table.survivalRate">生存率</th>
                        </tr>
                    </thead>
                    <tbody id="terrorsBody">
                        <tr><td colspan="4" class="loading" data-i18n="common.loading">読み込み中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<style>
.profile-page {
    max-width: 1200px;
    margin: 0 auto;
}

.profile-header {
    background: var(--bg-secondary);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 2rem;
    margin-bottom: 2rem;
    display: flex;
    align-items: center;
    gap: 2rem;
}

.profile-loading {
    color: var(--text-secondary);
    text-align: center;
    width: 100%;
}

.profile-avatar {
    width: 120px;
    height: 120px;
    border-radius: 50%;
    background: var(--bg-tertiary);
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    flex-shrink: 0;
}

.profile-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.profile-info {
    flex: 1;
}

.profile-name {
    font-size: 2rem;
    font-weight: bold;
    margin-bottom: 0.5rem;
}

.profile-bio {
    color: var(--text-secondary);
    margin-bottom: 1rem;
}

.profile-stats {
    display: flex;
    gap: 2rem;
}

.profile-stat {
    text-align: center;
}

.profile-stat-value {
    font-size: 1.5rem;
    font-weight: bold;
    color: var(--accent);
}

.profile-stat-label {
    font-size: 0.875rem;
    color: var(--text-secondary);
}

.profile-actions {
    display: flex;
    gap: 1rem;
}

.profile-badge {
    display: inline-block;
    padding: 0.25rem 0.75rem;
    background: var(--bg-tertiary);
    border-radius: 20px;
    font-size: 0.875rem;
    color: var(--text-secondary);
    margin-left: 1rem;
}

.profile-badge.private {
    background: rgba(239, 68, 68, 0.2);
    color: var(--error);
}

.stats-tabs {
    display: flex;
    gap: 0.5rem;
    margin-bottom: 1.5rem;
    border-bottom: 1px solid var(--border);
    padding-bottom: 0.5rem;
}

.tab-btn {
    padding: 0.75rem 1.5rem;
    background: transparent;
    border: none;
    color: var(--text-secondary);
    cursor: pointer;
    font-size: 1rem;
    border-radius: var(--radius) var(--radius) 0 0;
    transition: all 0.2s;
}

.tab-btn:hover {
    color: var(--text-primary);
    background: var(--bg-secondary);
}

.tab-btn.active {
    color: var(--accent);
    background: var(--bg-secondary);
    border-bottom: 2px solid var(--accent);
}

.tab-content {
    background: var(--bg-secondary);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 1.5rem;
}

.tab-pane {
    display: none;
}

.tab-pane.active {
    display: block;
}

.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
    gap: 1.5rem;
}

.stats-section h3 {
    margin-bottom: 1rem;
    color: var(--text-secondary);
    font-size: 1rem;
}

.survival-badge {
    display: inline-block;
    padding: 0.25rem 0.5rem;
    border-radius: 4px;
    font-size: 0.875rem;
    font-weight: 500;
}

.survival-badge.survived {
    background: rgba(34, 197, 94, 0.2);
    color: var(--success);
}

.survival-badge.died {
    background: rgba(239, 68, 68, 0.2);
    color: var(--error);
}

.items-list {
    display: flex;
    flex-wrap: wrap;
    gap: 0.25rem;
}

.item-tag {
    display: inline-block;
    padding: 0.125rem 0.5rem;
    background: var(--bg-tertiary);
    border-radius: 4px;
    font-size: 0.75rem;
}

.load-more {
    text-align: center;
    margin-top: 1rem;
}

.rate-bar-container {
    display: flex;
    align-items: center;
    gap: 0.5rem;
}

.rate-bar {
    flex: 1;
    height: 8px;
    background: var(--bg-tertiary);
    border-radius: 4px;
    overflow: hidden;
    max-width: 100px;
}

.rate-bar-fill {
    height: 100%;
    background: var(--success);
    border-radius: 4px;
}

.rate-text {
    min-width: 50px;
    text-align: right;
}

@media (max-width: 768px) {
    .profile-header {
        flex-direction: column;
        text-align: center;
    }

    .profile-stats {
        justify-content: center;
    }

    .stats-tabs {
        flex-wrap: wrap;
    }

    .stats-grid {
        grid-template-columns: 1fr;
    }
}
</style>
{% endblock %}

{% block scripts %}
<script>
    const username = "{{ username }}";
    let historyOffset = 0;
    const historyLimit = 50;
    let detailedStats = null;

    // Load profile data
    async function loadProfile() {
        try {
            const res = await fetch(`/api/v1/profile/player/${encodeURIComponent(username)}`);
            if (!res.ok) {
                if (res.status === 404) {
                    document.getElementById('profileHeader').innerHTML = `
                        <div class="profile-loading">${t('profile.notFound')}</div>
                    `;
                    return;
                }
                if (res.status === 403) {
                    document.getElementById('profileHeader').innerHTML = `
                        <div class="profile-loading">${t('profile.isPrivate')}</div>
                    `;
                    return;
                }
                throw new Error('Failed to load profile');
            }

            const profile = await res.json();
            renderProfile(profile);
            loadDetailedStats();
            loadHistory();
        } catch (error) {
            console.error('Failed to load profile:', error);
            document.getElementById('profileHeader').innerHTML = `
                <div class="profile-loading">${t('common.error')}</div>
            `;
        }
    }

    function renderProfile(profile) {
        // Generate avatar URL using DiceBear API with the seed
        const avatarUrl = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(profile.avatar_seed || profile.vrchat_name)}`;

        document.getElementById('profileHeader').innerHTML = `
            <div class="profile-avatar">
                <img src="${avatarUrl}" alt="Avatar">
            </div>
            <div class="profile-info">
                <div class="profile-name">
                    ${escapeHtml(profile.vrchat_name)}
                    ${!profile.is_public ? `<span class="profile-badge private">${t('profile.private')}</span>` : ''}
                    ${profile.is_own_profile ? `<span class="profile-badge">${t('profile.yourProfile')}</span>` : ''}
                </div>
                ${profile.bio ? `<div class="profile-bio">${escapeHtml(profile.bio)}</div>` : ''}
                <div class="profile-stats">
                    <div class="profile-stat">
                        <div class="profile-stat-value">${profile.total_rounds}</div>
                        <div class="profile-stat-label">${t('profile.rounds')}</div>
                    </div>
                    <div class="profile-stat">
                        <div class="profile-stat-value">${profile.total_survivals}</div>
                        <div class="profile-stat-label">${t('profile.survivals')}</div>
                    </div>
                    <div class="profile-stat">
                        <div class="profile-stat-value">${profile.survival_rate}%</div>
                        <div class="profile-stat-label">${t('profile.survivalRate')}</div>
                    </div>
                </div>
            </div>
            ${profile.is_own_profile ? `
                <div class="profile-actions">
                    <a href="/my-history" class="btn btn-primary">${t('profile.myDetailedLog')}</a>
                </div>
            ` : ''}
        `;
    }

    async function loadDetailedStats() {
        try {
            const res = await fetch(`/api/v1/profile/player/${encodeURIComponent(username)}/stats`);
            if (res.ok) {
                detailedStats = await res.json();
                renderRoundTypeStats();
                renderItemStats();
                renderTerrorStats();
            }
        } catch (error) {
            console.error('Failed to load detailed stats:', error);
        }
    }

    function renderRoundTypeStats() {
        const tbody = document.getElementById('roundTypeStatsBody');
        if (!detailedStats || detailedStats.round_type_stats.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="empty">${t('profile.noData')}</td></tr>`;
            return;
        }

        tbody.innerHTML = detailedStats.round_type_stats.map(s => `
            <tr>
                <td><span class="round-type">${escapeHtml(s.round_type)}</span></td>
                <td>${s.rounds_played}</td>
                <td>${s.survivals}</td>
                <td>
                    <div class="rate-bar-container">
                        <div class="rate-bar">
                            <div class="rate-bar-fill" style="width: ${s.survival_rate}%"></div>
                        </div>
                        <span class="rate-text">${s.survival_rate}%</span>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    function renderItemStats() {
        const tbody = document.getElementById('itemsBody');
        if (!detailedStats || detailedStats.item_stats.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="empty">${t('profile.noData')}</td></tr>`;
            return;
        }

        tbody.innerHTML = detailedStats.item_stats.map(s => `
            <tr>
                <td>${escapeHtml(s.item_name)}</td>
                <td>${s.times_held}</td>
                <td>${s.times_survived}</td>
                <td>
                    <div class="rate-bar-container">
                        <div class="rate-bar">
                            <div class="rate-bar-fill" style="width: ${s.survival_rate}%"></div>
                        </div>
                        <span class="rate-text">${s.survival_rate}%</span>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    function renderTerrorStats() {
        const tbody = document.getElementById('terrorsBody');
        if (!detailedStats || detailedStats.terror_stats.length === 0) {
            tbody.innerHTML = `<tr><td colspan="4" class="empty">${t('profile.noData')}</td></tr>`;
            return;
        }

        tbody.innerHTML = detailedStats.terror_stats.map(s => `
            <tr>
                <td>${escapeHtml(s.terror_name)}</td>
                <td>${s.encounters}</td>
                <td>${s.survivals}</td>
                <td>
                    <div class="rate-bar-container">
                        <div class="rate-bar">
                            <div class="rate-bar-fill" style="width: ${s.survival_rate}%"></div>
                        </div>
                        <span class="rate-text">${s.survival_rate}%</span>
                    </div>
                </td>
            </tr>
        `).join('');
    }

    async function loadHistory(append = false) {
        try {
            const res = await fetch(`/api/v1/profile/player/${encodeURIComponent(username)}/history?limit=${historyLimit}&offset=${historyOffset}`);
            if (res.ok) {
                const history = await res.json();
                renderHistory(history, append);

                // Show/hide load more button
                const loadMoreBtn = document.getElementById('loadMoreHistory');
                if (history.length === historyLimit) {
                    loadMoreBtn.style.display = 'inline-block';
                } else {
                    loadMoreBtn.style.display = 'none';
                }
            }
        } catch (error) {
            console.error('Failed to load history:', error);
        }
    }

    function renderHistory(history, append = false) {
        const tbody = document.getElementById('historyBody');

        if (!append && history.length === 0) {
            tbody.innerHTML = `<tr><td colspan="6" class="empty">${t('profile.noData')}</td></tr>`;
            return;
        }

        const rows = history.map(h => `
            <tr>
                <td>${new Date(h.started_at).toLocaleString('ja-JP')}</td>
                <td><span class="round-type">${escapeHtml(h.round_type)}</span></td>
                <td>${escapeHtml(h.map_name || '-')}</td>
                <td>${h.terrors.length > 0 ? h.terrors.slice(0, 2).map(terror => escapeHtml(terror)).join(', ') + (h.terrors.length > 2 ? '...' : '') : '-'}</td>
                <td>
                    ${h.items.length > 0 ? `
                        <div class="items-list">
                            ${h.items.map(i => `<span class="item-tag">${escapeHtml(i)}</span>`).join('')}
                        </div>
                    ` : '-'}
                </td>
                <td>
                    <span class="survival-badge ${h.survived ? 'survived' : 'died'}">
                        ${h.survived ? t('profile.survived') : t('profile.died')}
                    </span>
                </td>
            </tr>
        `).join('');

        if (append) {
            tbody.innerHTML += rows;
        } else {
            tbody.innerHTML = rows;
        }
    }

    // Tab switching
    document.querySelectorAll('.tab-btn').forEach(btn => {
        btn.addEventListener('click', () => {
            // Remove active class from all
            document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
            document.querySelectorAll('.tab-pane').forEach(p => p.classList.remove('active'));

            // Add active class to clicked
            btn.classList.add('active');
            document.getElementById(btn.dataset.tab).classList.add('active');
        });
    });

    // Load more history
    document.getElementById('loadMoreHistory').addEventListener('click', () => {
        historyOffset += historyLimit;
        loadHistory(true);
    });

    // Initial load
    loadProfile();
</script>
{% endblock %}
