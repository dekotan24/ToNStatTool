{% extends "base.html" %}

{% block title %}プレイヤー検索 - ToN Stat Web{% endblock %}

{% block content %}
<div class="players-page">
    <h1 data-i18n="players.title">プレイヤー検索</h1>
    <p class="subtitle" data-i18n="players.subtitle">プレイヤーのプロフィールを検索</p>

    <!-- Search Section -->
    <div class="search-section">
        <div class="search-form">
            <input type="text" id="searchInput" class="search-input" placeholder="VRChat名で検索..." data-i18n="players.searchPlaceholder">
            <button id="searchBtn" class="btn btn-primary" data-i18n="players.search">検索</button>
        </div>
    </div>

    <!-- Results -->
    <div class="results-section">
        <div id="resultsInfo" class="results-info"></div>
        <div class="players-grid" id="playersGrid">
            <div class="loading-message" data-i18n="players.enterNamePrompt">プレイヤー名を入力して検索</div>
        </div>
    </div>

</div>

<style>
.players-page {
    max-width: 1200px;
    margin: 0 auto;
}

.players-page h1 {
    margin-bottom: 0.5rem;
}

.subtitle {
    color: var(--text-secondary);
    margin-bottom: 2rem;
}

.search-section {
    background: var(--bg-secondary);
    padding: 1.5rem;
    border-radius: var(--radius);
    border: 1px solid var(--border);
    margin-bottom: 2rem;
}

.search-form {
    display: flex;
    gap: 1rem;
    max-width: 500px;
}

.search-input {
    flex: 1;
    padding: 0.75rem 1rem;
    background-color: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-primary);
    font-size: 1rem;
}

.search-input:focus {
    outline: none;
    border-color: var(--accent);
}

.results-section {
    margin-bottom: 2rem;
}

.results-info {
    color: var(--text-secondary);
    margin-bottom: 1rem;
}

.players-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
    gap: 1rem;
}

.loading-message {
    grid-column: 1 / -1;
    text-align: center;
    color: var(--text-secondary);
    padding: 2rem;
}

.player-card {
    background: var(--bg-secondary);
    border-radius: var(--radius);
    border: 1px solid var(--border);
    padding: 1.5rem;
    display: flex;
    align-items: center;
    gap: 1rem;
    transition: border-color 0.2s;
    cursor: pointer;
    text-decoration: none;
    color: inherit;
}

.player-card:hover {
    border-color: var(--accent);
}

.player-avatar {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    background: var(--bg-tertiary);
    overflow: hidden;
    flex-shrink: 0;
}

.player-avatar img {
    width: 100%;
    height: 100%;
    object-fit: cover;
}

.player-info {
    flex: 1;
    min-width: 0;
}

.player-name {
    font-weight: bold;
    font-size: 1.1rem;
    margin-bottom: 0.25rem;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
}

.player-stats {
    display: flex;
    gap: 1rem;
    color: var(--text-secondary);
    font-size: 0.875rem;
}

.player-stat {
    display: flex;
    align-items: center;
    gap: 0.25rem;
}

.player-stat-value {
    color: var(--accent);
    font-weight: 500;
}

@media (max-width: 768px) {
    .search-form {
        flex-direction: column;
    }

    .players-grid {
        grid-template-columns: 1fr;
    }
}
</style>
{% endblock %}

{% block scripts %}
<script>
    // Search players
    async function searchPlayers() {
        const query = document.getElementById('searchInput').value.trim();
        if (!query) {
            document.getElementById('playersGrid').innerHTML = `<div class="loading-message">${t('players.enterNamePrompt')}</div>`;
            document.getElementById('resultsInfo').textContent = '';
            return;
        }

        document.getElementById('playersGrid').innerHTML = `<div class="loading-message">${t('common.searching')}</div>`;

        try {
            const res = await fetch(`/api/v1/profile/search?q=${encodeURIComponent(query)}`);
            if (res.ok) {
                const players = await res.json();
                renderPlayers(players);
            }
        } catch (error) {
            console.error('Search failed:', error);
            document.getElementById('playersGrid').innerHTML = `<div class="loading-message">${t('common.searchFailed')}</div>`;
        }
    }

    function renderPlayers(players) {
        const grid = document.getElementById('playersGrid');

        if (players.length === 0) {
            grid.innerHTML = `<div class="loading-message">${t('players.noPlayers')}</div>`;
            document.getElementById('resultsInfo').textContent = '0 players found';
            return;
        }

        document.getElementById('resultsInfo').textContent = `${players.length} player${players.length !== 1 ? 's' : ''} found`;

        grid.innerHTML = players.map(p => {
            const avatarUrl = `https://api.dicebear.com/7.x/bottts/svg?seed=${encodeURIComponent(p.avatar_seed || p.vrchat_name)}`;
            return `
                <a href="/player/${encodeURIComponent(p.username)}" class="player-card">
                    <div class="player-avatar">
                        <img src="${avatarUrl}" alt="Avatar">
                    </div>
                    <div class="player-info">
                        <div class="player-name">${escapeHtml(p.vrchat_name)}</div>
                        <div class="player-stats">
                            <div class="player-stat">
                                <span class="player-stat-value">${p.total_rounds}</span> rounds
                            </div>
                            <div class="player-stat">
                                <span class="player-stat-value">${p.survival_rate}%</span> survival
                            </div>
                        </div>
                    </div>
                </a>
            `;
        }).join('');
    }

    // Event listeners
    document.getElementById('searchBtn').addEventListener('click', searchPlayers);
    document.getElementById('searchInput').addEventListener('keypress', (e) => {
        if (e.key === 'Enter') searchPlayers();
    });
</script>
{% endblock %}
