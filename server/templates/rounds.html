{% extends "base.html" %}

{% block title %}Statistics - ToN Stats{% endblock %}

{% block content %}
<div class="page-content">
    <h1>Statistics</h1>

    <div class="stats-grid">
        <!-- Round Types -->
        <div class="stats-section">
            <h2>Round Types</h2>
            <div class="table-container">
                <table class="data-table" id="roundTypesTable">
                    <thead>
                        <tr>
                            <th>Round Type</th>
                            <th>Count</th>
                            <th>%</th>
                        </tr>
                    </thead>
                    <tbody id="roundTypesBody">
                        <tr><td colspan="3" class="loading">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Maps -->
        <div class="stats-section">
            <h2>Maps</h2>
            <div class="table-container">
                <table class="data-table" id="mapsTable">
                    <thead>
                        <tr>
                            <th>Map Name</th>
                            <th>Count</th>
                            <th>%</th>
                        </tr>
                    </thead>
                    <tbody id="mapsBody">
                        <tr><td colspan="3" class="loading">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Terrors -->
        <div class="stats-section full-width">
            <h2>Terrors</h2>
            <div class="search-bar">
                <input type="text" id="terrorSearch" placeholder="Search terror name..." class="search-input">
            </div>
            <div class="table-container">
                <table class="data-table" id="terrorTable">
                    <thead>
                        <tr>
                            <th>Terror Name</th>
                            <th>Encounters</th>
                        </tr>
                    </thead>
                    <tbody id="terrorTableBody">
                        <tr><td colspan="2" class="loading">Loading...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<style>
.stats-grid {
    display: grid;
    grid-template-columns: repeat(auto-fit, minmax(400px, 1fr));
    gap: 2rem;
}

.stats-section.full-width {
    grid-column: 1 / -1;
}

.search-bar {
    margin-bottom: 1rem;
}

.search-input {
    width: 100%;
    max-width: 300px;
    padding: 0.5rem 1rem;
    background-color: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-primary);
}

.search-input:focus {
    outline: none;
    border-color: var(--accent);
}
</style>
{% endblock %}

{% block scripts %}
<script>
    let terrorData = [];
    let searchQuery = '';

    async function loadStats() {
        try {
            // Round types
            const typesRes = await fetch('/api/v1/stats/round-types');
            if (typesRes.ok) {
                const types = await typesRes.json();
                const tbody = document.getElementById('roundTypesBody');
                if (types.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="empty">No data yet</td></tr>';
                } else {
                    tbody.innerHTML = types.map(t => `
                        <tr>
                            <td><span class="round-type">${escapeHtml(t.round_type)}</span></td>
                            <td>${t.occurrence_count.toLocaleString()}</td>
                            <td>${t.percentage.toFixed(1)}%</td>
                        </tr>
                    `).join('');
                }
            }

            // Maps
            const mapsRes = await fetch('/api/v1/stats/maps?limit=50');
            if (mapsRes.ok) {
                const maps = await mapsRes.json();
                const tbody = document.getElementById('mapsBody');
                if (maps.length === 0) {
                    tbody.innerHTML = '<tr><td colspan="3" class="empty">No data yet</td></tr>';
                } else {
                    tbody.innerHTML = maps.map(m => `
                        <tr>
                            <td>${escapeHtml(m.map_name)}</td>
                            <td>${m.occurrence_count.toLocaleString()}</td>
                            <td>${m.percentage.toFixed(1)}%</td>
                        </tr>
                    `).join('');
                }
            }

            // Terrors
            const terrorsRes = await fetch('/api/v1/stats/terrors?limit=200');
            if (terrorsRes.ok) {
                terrorData = await terrorsRes.json();
                renderTerrors();
            }
        } catch (error) {
            console.error('Failed to load stats:', error);
        }
    }

    function renderTerrors() {
        const tbody = document.getElementById('terrorTableBody');
        let filtered = terrorData;

        if (searchQuery) {
            filtered = terrorData.filter(t =>
                t.name.toLowerCase().includes(searchQuery.toLowerCase())
            );
        }

        if (filtered.length === 0) {
            tbody.innerHTML = '<tr><td colspan="2" class="empty">No terrors found</td></tr>';
            return;
        }

        tbody.innerHTML = filtered.map(t => `
            <tr>
                <td>${escapeHtml(t.name)}</td>
                <td>${t.encounter_count.toLocaleString()}</td>
            </tr>
        `).join('');
    }

    // Search functionality
    document.getElementById('terrorSearch').addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderTerrors();
    });

    loadStats();
</script>
{% endblock %}
