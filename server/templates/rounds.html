{% extends "base.html" %}

{% block title %}統計 - ToN Stats{% endblock %}

{% block content %}
<div class="page-content">
    <h1 data-i18n="statistics.title">統計</h1>

    <div class="stats-row">
        <!-- Round Types -->
        <div class="stats-section">
            <h2 data-i18n="statistics.roundTypes">ラウンド種別統計</h2>
            <div class="table-container">
                <table class="data-table" id="roundTypesTable">
                    <thead>
                        <tr>
                            <th data-i18n="table.roundType">種別</th>
                            <th data-i18n="statistics.occurrence">回数</th>
                            <th data-i18n="statistics.percentage">割合</th>
                        </tr>
                    </thead>
                    <tbody id="roundTypesBody">
                        <tr><td colspan="3" class="loading" data-i18n="common.loading">読み込み中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Maps -->
        <div class="stats-section">
            <h2 data-i18n="statistics.maps">マップ統計</h2>
            <div class="table-container">
                <table class="data-table" id="mapsTable">
                    <thead>
                        <tr>
                            <th data-i18n="table.map">マップ名</th>
                            <th data-i18n="statistics.occurrence">回数</th>
                            <th data-i18n="statistics.percentage">割合</th>
                        </tr>
                    </thead>
                    <tbody id="mapsBody">
                        <tr><td colspan="3" class="loading" data-i18n="common.loading">読み込み中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>

        <!-- Terrors -->
        <div class="stats-section">
            <h2 data-i18n="statistics.terrors">テラー統計</h2>
            <div class="search-bar">
                <input type="text" id="terrorSearch" placeholder="テラー名を検索..." class="search-input">
            </div>
            <div class="table-container">
                <table class="data-table" id="terrorTable">
                    <thead>
                        <tr>
                            <th data-i18n="table.terrors">テラー名</th>
                            <th data-i18n="statistics.encounterCount">遭遇数</th>
                            <th data-i18n="statistics.percentage">割合</th>
                        </tr>
                    </thead>
                    <tbody id="terrorTableBody">
                        <tr><td colspan="3" class="loading" data-i18n="common.loading">読み込み中...</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</div>

<style>
.stats-row {
    display: flex;
    gap: 1.5rem;
    flex-wrap: wrap;
}

.stats-row .stats-section {
    flex: 1;
    min-width: 280px;
    max-height: 500px;
    display: flex;
    flex-direction: column;
}

.stats-row .stats-section .table-container {
    flex: 1;
    overflow-y: auto;
}

.search-bar {
    margin-bottom: 1rem;
}

.search-input {
    width: 100%;
    max-width: 100%;
    padding: 0.5rem 1rem;
    background-color: var(--bg-tertiary);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    color: var(--text-primary);
}

.search-input:focus {
    outline: none;
    border-color: var(--accent);
}

@media (max-width: 1024px) {
    .stats-row {
        flex-direction: column;
    }

    .stats-row .stats-section {
        max-height: 400px;
    }
}
</style>
{% endblock %}

{% block scripts %}
<script>
    let terrorData = [];
    let totalTerrorEncounters = 0;
    let searchQuery = '';

    async function loadStats() {
        try {
            // Round types
            const typesRes = await fetch('/api/v1/stats/round-types');
            if (typesRes.ok) {
                const types = await typesRes.json();
                const tbody = document.getElementById('roundTypesBody');
                if (types.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" class="empty">${t('common.noDataYet')}</td></tr>`;
                } else {
                    tbody.innerHTML = types.map(rt => `
                        <tr>
                            <td><span class="round-type">${escapeHtml(rt.round_type)}</span></td>
                            <td>${rt.occurrence_count.toLocaleString()}</td>
                            <td>${rt.percentage.toFixed(1)}%</td>
                        </tr>
                    `).join('');
                }
            }

            // Maps
            const mapsRes = await fetch('/api/v1/stats/maps?limit=50');
            if (mapsRes.ok) {
                const maps = await mapsRes.json();
                const tbody = document.getElementById('mapsBody');
                if (maps.length === 0) {
                    tbody.innerHTML = `<tr><td colspan="3" class="empty">${t('common.noDataYet')}</td></tr>`;
                } else {
                    tbody.innerHTML = maps.map(m => `
                        <tr>
                            <td>${escapeHtml(m.map_name)}</td>
                            <td>${m.occurrence_count.toLocaleString()}</td>
                            <td>${m.percentage.toFixed(1)}%</td>
                        </tr>
                    `).join('');
                }
            }

            // Terrors
            const terrorsRes = await fetch('/api/v1/stats/terrors?limit=200');
            if (terrorsRes.ok) {
                terrorData = await terrorsRes.json();
                // Calculate total encounters for percentage
                totalTerrorEncounters = terrorData.reduce((sum, t) => sum + t.encounter_count, 0);
                renderTerrors();
            }
        } catch (error) {
            console.error('Failed to load stats:', error);
        }
    }

    function renderTerrors() {
        const tbody = document.getElementById('terrorTableBody');
        let filtered = terrorData;

        if (searchQuery) {
            filtered = terrorData.filter(t =>
                t.name.toLowerCase().includes(searchQuery.toLowerCase())
            );
        }

        if (filtered.length === 0) {
            tbody.innerHTML = `<tr><td colspan="3" class="empty">${t('common.noTerrors')}</td></tr>`;
            return;
        }

        tbody.innerHTML = filtered.map(ts => {
            const percentage = totalTerrorEncounters > 0
                ? (ts.encounter_count / totalTerrorEncounters * 100).toFixed(1)
                : '0.0';
            return `
                <tr>
                    <td>${escapeHtml(ts.name)}</td>
                    <td>${ts.encounter_count.toLocaleString()}</td>
                    <td>${percentage}%</td>
                </tr>
            `;
        }).join('');
    }

    // Search functionality
    document.getElementById('terrorSearch').addEventListener('input', (e) => {
        searchQuery = e.target.value;
        renderTerrors();
    });

    loadStats();
</script>
{% endblock %}
