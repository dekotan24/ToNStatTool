# ToN Stats Server - nginx Configuration
# このファイルを /etc/nginx/sites-available/ にコピーし、sites-enabledにシンボリックリンクを作成

# レート制限ゾーン
limit_req_zone $binary_remote_addr zone=ton_api:10m rate=10r/s;
limit_req_zone $binary_remote_addr zone=ton_login:10m rate=3r/m;

# アップストリーム（FastAPIサーバー）
upstream ton_stats_backend {
    server 127.0.0.1:8000;
    keepalive 32;
}

server {
    listen 80;
    server_name your-domain.com;  # 実際のドメインに変更

    # HTTPSへリダイレクト
    return 301 https://$server_name$request_uri;
}

server {
    listen 443 ssl http2;
    server_name your-domain.com;  # 実際のドメインに変更

    # SSL設定（Let's Encryptを使用する場合はcertbotが自動設定）
    ssl_certificate /etc/letsencrypt/live/your-domain.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/your-domain.com/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:50m;
    ssl_session_tickets off;

    # 推奨SSL設定
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;

    # HSTS
    add_header Strict-Transport-Security "max-age=63072000" always;

    # セキュリティヘッダー
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # クローラー禁止ヘッダー
    add_header X-Robots-Tag "noindex, nofollow, noarchive, nosnippet" always;

    # ルートディレクトリ
    root /path/to/server/static;

    # ログ
    access_log /var/log/nginx/ton_stats_access.log;
    error_log /var/log/nginx/ton_stats_error.log;

    # リクエストサイズ制限
    client_max_body_size 1m;

    # タイムアウト設定
    proxy_connect_timeout 60s;
    proxy_send_timeout 60s;
    proxy_read_timeout 60s;

    # 静的ファイル
    location /static/ {
        alias /path/to/server/static/;
        expires 7d;
        add_header Cache-Control "public, immutable";

        # セキュリティヘッダー（静的ファイルにも適用）
        add_header X-Frame-Options "SAMEORIGIN" always;
        add_header X-Content-Type-Options "nosniff" always;
    }

    # robots.txt
    location = /robots.txt {
        proxy_pass http://ton_stats_backend;
        proxy_set_header Host $host;
    }

    # ログインAPI（レート制限厳しめ）
    location ~ ^/api/v1/auth/(login|register)$ {
        limit_req zone=ton_login burst=5 nodelay;

        proxy_pass http://ton_stats_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # イベント受信API（クライアントアプリから）
    location /api/v1/events {
        limit_req zone=ton_api burst=20 nodelay;

        proxy_pass http://ton_stats_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # その他のAPI
    location /api/ {
        limit_req zone=ton_api burst=10 nodelay;

        proxy_pass http://ton_stats_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ページルート
    location / {
        proxy_pass http://ton_stats_backend;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
    }

    # ヘルスチェック（内部用）
    location = /api/v1/health {
        proxy_pass http://ton_stats_backend;
        proxy_set_header Host $host;
        access_log off;
    }

    # 不要なパスをブロック
    location ~ /\. {
        deny all;
    }

    location ~ ^/(\.git|\.env|\.htaccess) {
        deny all;
    }
}
